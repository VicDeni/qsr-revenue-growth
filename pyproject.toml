[project]
name = "qsr-revenue-growth"
version = "1.0.0"
description = "QSR revenue growth analytics: BigQuery pipeline, pricing/demand/customer analysis, Tableau dashboard"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
